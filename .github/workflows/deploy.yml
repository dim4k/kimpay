name: Build and Push Docker Image

# Images are only published once CI (lint, type check, unit tests) passed on
# main, and are built from exactly the commit CI tested.
on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push app Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          build-args: |
            PUBLIC_POCKETBASE_URL=${{ secrets.PUBLIC_POCKETBASE_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kimpay-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kimpay-app:${{ env.COMMIT_SHA }}

      - name: Build and push PocketBase Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./pocketbase/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kimpay-pb:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kimpay-pb:${{ env.COMMIT_SHA }}

      - name: Build and push Homepage Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./homepage
          file: ./homepage/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kimpay-homepage:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kimpay-homepage:${{ env.COMMIT_SHA }}
