services:
  # Isolated PocketBase for Tests
  pocketbase-test:
    build:
      context: .
      dockerfile: pocketbase/Dockerfile
    volumes:
      # Mount migrations/hooks for structure (Schema/JS logic)
      - ./pocketbase/pb_migrations:/pb_migrations
      - ./pocketbase/pb_hooks:/pb_hooks
      # DO NOT bind mount pb_data (use anonymous volume for ephemeral isolation)
    environment:
      # Every browser of the suite comes from this one IP
      - RATE_LIMIT_MULTIPLIER=100
    # A superuser for the tests (e.g. to log in without email: loginWithNewAccount)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /usr/local/bin/pocketbase superuser upsert e2e@kimpay.test e2e-superuser-password --dir=/pb_data --migrationsDir=/pb_migrations
        && exec /usr/local/bin/pocketbase serve --http=0.0.0.0:8090 --dir=/pb_data --migrationsDir=/pb_migrations --hooksDir=/pb_hooks
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  tests:
    image: mcr.microsoft.com/playwright:v1.64.0-jammy
    working_dir: /app
    volumes:
      - ./app:/app
      - /app/node_modules
    environment:
      - CI=true
      - PUBLIC_POCKETBASE_URL=http://pocketbase-test:8090
      # Extra Playwright CLI args, e.g. a spec file or --update-snapshots
      - PLAYWRIGHT_ARGS=${PLAYWRIGHT_ARGS:-}
    depends_on:
      pocketbase-test:
        condition: service_healthy
    command: /bin/bash -c "npm ci && npm run build && npx playwright test $${PLAYWRIGHT_ARGS}"
    # No external network - verify isolation default

  # Unit Tests (Vitest) - No PocketBase needed
  unit-tests:
    image: node:24-slim
    working_dir: /app
    volumes:
      - ./app:/app
      - /app/node_modules
    environment:
      - CI=true
    command: /bin/bash -c "npm ci && npm run test:unit"
