server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;

    # SPA routes all fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Files whose name does not change between deployments must always be
    # revalidated, otherwise browsers keep running an outdated app shell
    # (the `try_files` fallback above lands here as well).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
    }
    location = /_app/version.json {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # Content-hashed build output: safe to cache forever (`^~` takes
    # precedence over the extension regex below).
    location ^~ /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Other static assets are not hashed: cache briefly.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        add_header Cache-Control "public, max-age=86400";
    }
}
